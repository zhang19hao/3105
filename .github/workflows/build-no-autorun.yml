name: Build IPA (no auto exploit)

on:
  push:
    branches: [ no-autorun ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PATCH_URL: https://aka.doubaocdn.com/s/hceLGAjHBt
  PATCH_SHA256: 3017bf5c642116fc9cc8b73cc18b149f50fdc96ca2ba19af2590bb990cb8aa20

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Disable auto kernel exploit
        run: |
          TARGET=ThreeOneOSFive/App.swift
          if grep -q "kexploitAutoRun" "$TARGET"; then
            echo "patch already present"
            exit 0
          fi
          curl -fL "$PATCH_URL" -o "$RUNNER_TEMP/App.swift"
          ACTUAL=$(shasum -a 256 "$RUNNER_TEMP/App.swift" | awk '{print $1}')
          if [ "$ACTUAL" != "$PATCH_SHA256" ]; then
            echo "checksum mismatch: expected $PATCH_SHA256 got $ACTUAL"
            exit 1
          fi
          cp "$RUNNER_TEMP/App.swift" "$TARGET"

      - name: Commit change back
        run: |
          if git diff --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: do not auto-run kernel exploit on launch [skip ci]"
          git push || echo "push failed, continuing build"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 150

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/out" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "no .app produced"
            exit 1
          fi
          echo "app: $APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry 3105.ipa Payload
          ls -lh 3105.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-no-autorun-ipa
          path: ${{ runner.temp }}/3105.ipa
          if-no-files-found: error

      - name: Publish / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: no-autorun
          name: no-autorun
          body: |
            Unsigned 3105 IPA with "open specified path" and kernel exploit auto-run disabled (build ${{ github.run_number }}).
          files: ${{ runner.temp }}/3105.ipa
          fail_on_unmatched_files: true

      - name: Record build status
        if: always()
        run: |
          mkdir -p status
          {
            echo "# Build status (no-autorun)"
            echo ""
            echo "- job status: ${{ job.status }}"
            echo "- run number: ${{ github.run_number }}"
            echo "- finished at: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > status/build-status-no-autorun.md
          if [ "${{ job.status }}" != "success" ] && [ -f "$RUNNER_TEMP/build.log" ]; then
            tail -n 160 "$RUNNER_TEMP/build.log" > status/build-log-no-autorun.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status
          git commit -m "chore: record build status [skip ci]" || true
          git push || true
