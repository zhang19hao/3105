name: Build IPA (debug config, official parity)

on:
  push:
    branches: [ debug-config ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          grep -c pathJumpStrings ThreeOneOSFive/views/AppDataBrowserView.swift

      - name: Build (Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Debug \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/out" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 150

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/out" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "no .app produced"
            exit 1
          fi
          echo "app: $APP"
          ls -lh "$APP/3105"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry 3105.ipa Payload
          ls -lh 3105.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-debug-ipa
          path: ${{ runner.temp }}/3105.ipa
          if-no-files-found: error

      - name: Publish / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug
          name: debug
          body: |
            Unsigned 3105 IPA built with the Debug configuration (same as the upstream 2.0 release) plus the open-specified-path feature. Build ${{ github.run_number }}.
          files: ${{ runner.temp }}/3105.ipa
          fail_on_unmatched_files: true

      - name: Record build status
        if: always()
        run: |
          mkdir -p status
          {
            echo "# Build status (debug config)"
            echo ""
            echo "- job status: ${{ job.status }}"
            echo "- run number: ${{ github.run_number }}"
            echo "- finished at: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > status/build-status-debug.md
          if [ "${{ job.status }}" != "success" ] && [ -f "$RUNNER_TEMP/build.log" ]; then
            tail -n 160 "$RUNNER_TEMP/build.log" > status/build-log-debug.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status
          git commit -m "chore: record build status [skip ci]" || true
          git push || true
